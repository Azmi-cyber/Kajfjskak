<!DOCTYPE html>
<html lang="id">
<head>

  <title>MegaPlay Player</title>

  <style>

      padding: 0;
      box-sizing: border-box;

      width: 100%;
      height: 100%;

    .player {
      width: 100%;
      height: 100dvh;

    }

      width: 100%;

      border: none;
      display: block;
    }

</head>
<body>

  <div class="player">
    <iframe
      src="https://megaplay.buzz/stream/mal/235/1/sub"
      allowfullscreen
      scrolling="no"
